<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>esp32-ir-remote</title>
<style>
  :root {
    --bg: #101418;
    --panel: #1a2026;
    --text: #e6e9ec;
    --muted: #8b949c;
    --border: #2a323a;
    --accent: #3b82f6;
    --ok: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto; padding: 0 12px 24px;
    max-width: 480px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; margin: 16px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .paired {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; margin-bottom: 12px;
  }
  .paired b { color: var(--ok); }
  .paired .none { color: var(--muted); }
  section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 12px;
  }
  section h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
  .profile {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .profile:first-of-type { border-top: none; }
  .profile .name { flex: 1 1 140px; font-size: 14px; }
  .profile .note { font-size: 12px; color: var(--muted); }
  button {
    font: inherit; color: #fff; background: var(--accent);
    border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:active { filter: brightness(0.85); }
  button.test { background: #f59e0b; }
  button.pair { background: var(--ok); }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-top: 4px;
  }
  .grid button {
    padding: 16px 0; font-size: 15px; background: #232a31;
    border: 1px solid var(--border); border-radius: 10px;
  }
  .grid button.power { grid-column: span 3; background: var(--danger); font-size: 17px; }
  #statusline { color: var(--muted); font-size: 13px; min-height: 18px; margin: 8px 2px; }
  #statusline.error { color: var(--danger); }
  #statusline.ok { color: var(--ok); }
  .macro {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .macro:first-of-type { border-top: none; }
  .macro .macro-name { flex: 1 1 120px; font-size: 14px; }
  .macro .macro-note { font-size: 12px; color: var(--muted); }
  .macro-empty { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  button.del { background: var(--danger); }
  button.cancel { background: #6b7280; }
  .playing { color: var(--ok); font-size: 13px; margin-left: 8px; }
  .rec-hint { color: var(--danger); font-size: 13px; margin: 0 0 8px; }
  #macroRecControl { margin-top: 8px; }
</style>
</head>
<body>
  <h1>ESP32 红外遥控</h1>
  <p class="sub">手机连热点后访问 192.168.4.1 · 先配对,再点键遥控</p>
  <div class="paired">当前配对:<span id="pairedName" class="none">未配对</span></div>
  <div id="statusline"></div>

  <section>
    <h2>① 配对 — 每档先试「电源」,电视有反应就「就用这档」</h2>
    <div id="profileList"><div class="profile"><span class="name">加载中…</span></div></div>
  </section>

  <section>
    <h2>② 遥控器</h2>
    <div class="grid" id="keyGrid"></div>
  </section>

  <section>
    <h2>③ 宏</h2>
    <div id="macroList"></div>
    <div id="macroRecControl"></div>
  </section>

<script>
function setStatus(msg, kind) {
  var el = document.getElementById('statusline');
  el.textContent = msg || '';
  el.className = kind || '';
}

function api(url, opts) {
  return fetch(url, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (data) {
      if (!r.ok) { throw new Error(data.error || ('HTTP ' + r.status)); }
      return data;
    });
  });
}

var lastStatus = null;      /* latest /api/status payload (recording routing) */
var playTimer = null;       /* 1s playback-progress poller */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderMacros(d) {
  var list = document.getElementById('macroList');
  var macros = d.macros || [];
  if (macros.length === 0) {
    list.innerHTML = '<p class="macro-empty">还没有宏 — 点下面「开始录制」录第一个</p>';
  } else {
    var html = '';
    macros.forEach(function (m) {
      html += '<div class="macro">' +
        '<span class="macro-name">' + esc(m.name) + '</span>' +
        '<span class="macro-note">' + m.step_count + ' 步 · 首键 ' + esc(m.first_key || '—') + '</span>' +
        '<button onclick="playMacro(' + m.id + ')">播放</button>' +
        '<button class="del" onclick="deleteMacro(' + m.id + ')">删除</button>' +
        '</div>';
    });
    list.innerHTML = html;
  }

  var st = d.playback || {};
  var ctl = document.getElementById('macroRecControl');
  if (st.state === 'recording') {
    ctl.innerHTML =
      '<p class="rec-hint">录制中… 点遥控器按键录入手势,完成后保存</p>' +
      '<button onclick="saveMacro()">停止并保存</button> ' +
      '<button class="cancel" onclick="cancelMacro()">取消</button>';
  } else {
    ctl.innerHTML = '<button onclick="startMacro()">开始录制</button>' +
      (st.state === 'playing' ? '<span class="playing">回放中:第 ' + (st.current_step || 0) + ' 步</span>' : '');
  }
}

function syncPlaybackPolling(d) {
  var playing = (d.playback || {}).state === 'playing';
  if (playing && !playTimer) {
    playTimer = setInterval(refreshStatus, 1000);
  } else if (!playing && playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
}

function refreshStatus() {
  api('/api/status').then(function (d) {
    lastStatus = d;
    var el = document.getElementById('pairedName');
    if (d.paired_profile === 255) {
      el.textContent = '未配对';
      el.className = 'none';
    } else {
      el.textContent = d.paired_name || ('档 #' + d.paired_profile);
      el.className = '';
    }
    renderMacros(d);
    syncPlaybackPolling(d);
  }).catch(function (e) { setStatus('读取状态失败: ' + e.message, 'error'); });
}

function refreshProfiles() {
  api('/api/profiles').then(function (list) {
    var html = '';
    list.forEach(function (p) {
      html += '<div class="profile">' +
        '<span class="name">' + p.name + '</span>' +
        '<span class="note">' + (p.keys_known ? '全键可用' : '部分键缺失') + '</span>' +
        '<button class="test" onclick="testPower(' + p.id + ')">电源测试</button>' +
        '<button class="pair" onclick="pair(' + p.id + ')">就用这档</button>' +
        '</div>';
    });
    document.getElementById('profileList').innerHTML = html;
  }).catch(function (e) { setStatus('读取信号库失败: ' + e.message, 'error'); });
}

function testPower(id) {
  setStatus('正在发送 档#' + id + ' 的电源键…');
  api('/api/key', { method: 'POST', body: JSON.stringify({ key: 'POWER', profile_id: id }) })
    .then(function () { setStatus('已发送 档#' + id + ' 的电源键,电视有反应吗?', 'ok'); })
    .catch(function (e) { setStatus('发送失败: ' + e.message, 'error'); });
}

function pair(id) {
  api('/api/pair', { method: 'POST', body: JSON.stringify({ profile_id: id }) })
    .then(function (d) {
      setStatus('已配对: 档#' + d.paired_profile, 'ok');
      refreshStatus();
    })
    .catch(function (e) { setStatus('配对失败: ' + e.message, 'error'); });
}

function sendKey(name) {
  /* 录制中:按键同时录成宏步骤并照常发送,由 /api/macro/step 一次完成。 */
  if (lastStatus && lastStatus.playback && lastStatus.playback.state === 'recording') {
    api('/api/macro/step', { method: 'POST', body: JSON.stringify({ key: name }) })
      .then(function () { setStatus('已录制并发送 ' + name, 'ok'); })
      .catch(function (e) { setStatus('录制按键失败: ' + e.message, 'error'); });
    return;
  }
  api('/api/key', { method: 'POST', body: JSON.stringify({ key: name }) })
    .then(function () { setStatus('已发送 ' + name, 'ok'); })
    .catch(function (e) { setStatus('发送失败: ' + e.message, 'error'); });
}

/* ---- 宏:录制 / 保存 / 回放 / 删除 ---- */

function findMacro(id) {
  if (!lastStatus || !lastStatus.macros) return null;
  for (var i = 0; i < lastStatus.macros.length; i++) {
    if (lastStatus.macros[i].id === id) return lastStatus.macros[i];
  }
  return null;
}

function startMacro() {
  api('/api/macro/start', { method: 'POST', body: '{}' })
    .then(function () { setStatus('录制中… 点遥控器按键', 'ok'); refreshStatus(); })
    .catch(function (e) { setStatus('开始录制失败: ' + e.message, 'error'); });
}

function saveMacro() {
  var name = window.prompt('给这个宏起个名字(最多 23 字):', '');
  if (name === null) return;                     /* 用户取消 */
  name = name.trim();
  if (!name) { setStatus('宏名不能为空', 'error'); return; }
  if (name.length > 23) { setStatus('宏名太长,最多 23 字', 'error'); return; }
  api('/api/macro/save', { method: 'POST', body: JSON.stringify({ name: name }) })
    .then(function () { setStatus('宏已保存: ' + name, 'ok'); refreshStatus(); })
    .catch(function (e) { setStatus('保存失败: ' + e.message, 'error'); refreshStatus(); });
}

function cancelMacro() {
  api('/api/macro/stop', { method: 'POST', body: '{}' })
    .then(function () { setStatus('已取消录制', 'ok'); refreshStatus(); })
    .catch(function (e) { setStatus('取消失败: ' + e.message, 'error'); refreshStatus(); });
}

function playMacro(id) {
  var m = findMacro(id);
  /* 开机宏确认:首键是 POWER 时先问电视是否已关,确认后才开始回放。 */
  if (m && m.first_key === 'POWER') {
    if (!window.confirm('本宏从开机开始,电视现在是否已关闭?')) return;
  }
  api('/api/macro/play', { method: 'POST', body: JSON.stringify({ id: id }) })
    .then(function () { setStatus('开始回放宏', 'ok'); refreshStatus(); })
    .catch(function (e) { setStatus('回放失败: ' + e.message, 'error'); refreshStatus(); });
}

function deleteMacro(id) {
  if (!window.confirm('确定删除这个宏?')) return;
  api('/api/macro/delete', { method: 'POST', body: JSON.stringify({ id: id }) })
    .then(function () { setStatus('已删除宏', 'ok'); refreshStatus(); })
    .catch(function (e) { setStatus('删除失败: ' + e.message, 'error'); refreshStatus(); });
}

/* 23 键布局(POWER 跨整行)。按键名称必须与固件 web_parse_key_name 完全一致。 */
var KEY_LAYOUT = [
  { name: 'POWER', cls: 'power' },
  { name: 'MENU' }, { name: 'EXIT' }, { name: 'MUTE' },
  { name: 'CH+' }, { name: 'OK' }, { name: 'CH-' },
  { name: 'VOL-' }, { name: 'UP' }, { name: 'VOL+' },
  { name: 'LEFT' }, { name: 'DOWN' }, { name: 'RIGHT' },
  { name: '1' }, { name: '2' }, { name: '3' },
  { name: '4' }, { name: '5' }, { name: '6' },
  { name: '7' }, { name: '8' }, { name: '9' },
  { name: '0' }
];

function renderGrid() {
  var html = '';
  KEY_LAYOUT.forEach(function (k) {
    html += '<button class="' + (k.cls || '') + '" onclick="sendKey(\'' + k.name + '\')">' + k.name + '</button>';
  });
  document.getElementById('keyGrid').innerHTML = html;
}

renderGrid();
refreshProfiles();
refreshStatus();
</script>
</body>
</html>
